<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数学应用证据图谱</title>
<style>
:root{font-family:system-ui,sans-serif;color:#e4ebf4;background:#101924}*{box-sizing:border-box}body{margin:0}header{padding:28px 4vw 18px;border-bottom:1px solid #344559}h1{margin:0;font-size:26px}header p{max-width:950px;color:#aebed0;line-height:1.6}.stats{display:flex;gap:28px;font-size:14px}.stats b{font-size:23px;color:#72d5bb}main{display:grid;grid-template-columns:310px 1fr;height:calc(100vh - 190px);min-height:600px}aside{padding:18px;border-right:1px solid #344559;overflow:auto}input,select,textarea,button{font:inherit;color:inherit;background:#1e3042;border:1px solid #486077;border-radius:6px;padding:10px}input,select,textarea{width:100%;margin-bottom:10px}button{cursor:pointer;text-align:left}button:hover,button.active{border-color:#72d5bb;background:#25473f}.families{display:grid;gap:7px}.families button{font-size:13px;line-height:1.5}section{padding:22px 3vw;overflow:auto}.legend{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}.badge{font-size:12px;border:1px solid #486077;border-radius:15px;padding:5px 10px}h2{margin-top:0}#network{display:flex;align-items:stretch;gap:15px;overflow:auto;padding-bottom:15px}.column{min-width:230px;max-width:350px;display:flex;flex-direction:column;gap:8px}.column h3{font-size:13px;color:#9cacc0}.node{display:block;width:100%;font-size:13px;line-height:1.5;border-left:4px solid #6ea4ce}.node.claim{border-left-color:#d4b278}.node.connection{border-left-color:#d792b8}.node.method{border-left-color:#72d5bb}#detail{white-space:pre-wrap;word-break:break-word;background:#172635;padding:18px;border-radius:8px;line-height:1.6;font-size:12px;max-height:650px;overflow:auto}#links button{margin:4px;font-size:12px}.muted{color:#9cacc0}.warning{color:#f0ca89}@media(max-width:760px){main{grid-template-columns:1fr;height:auto}aside{max-height:300px;border-bottom:1px solid #344559}#network{flex-direction:column}.column{max-width:none}}
</style><header><h1>数学应用证据图谱</h1><p>从 372 个成果族追到具体手稿、命题、可迁移零件和数值结果。登记、原文主张、假设与实验观察分别展示。节点连线表示带类型的关系，不代表数学命题已获证实。</p><div class="stats" id="stats"></div></header>
<main><aside><input id="search" placeholder="搜索族、结论、方法、应用或来源" aria-label="搜索全部图谱节点"><select id="subject" aria-label="学科筛选"><option value="">全部学科</option></select><p id="search-count" class="muted"></p><div class="families" id="families"></div><p><a href="navigation.md" style="color:#72d5bb">证据与缺口索引</a></p></aside><section><h2 id="title">选择成果族</h2><p id="coverage" class="warning"></p><div class="legend"><span class="badge">蓝：手稿</span><span class="badge">金：原文主张</span><span class="badge">绿：方法</span><span class="badge">粉：应用观察</span><span class="badge">未知 ≠ 通过</span></div><div id="network"></div><h3>前提变化影响预览</h3><label for="impact-input">需复核的节点 ID（空格或逗号分隔）</label><textarea id="impact-input" rows="2" aria-label="需复核的节点ID"></textarea><div><button id="impact-add">加入当前节点</button> <button id="impact-run">预览影响</button> <button id="impact-clear">清空</button></div><p class="muted">按已登记依赖定位复核范围；全部替代路线受影响时再联动主结论。未受影响不代表已验证，预览不会改写证据或可信度。</p><p id="impact-summary" role="status" aria-live="polite"></p><div id="impact-routes"></div><div id="impact-results"></div><h3 id="detail-title">出处、条件与关系</h3><div id="links"></div><pre id="detail">选择节点查看完整记录与出处定位。</pre></section></main>
<script>
__IMPACT_LOGIC__
let currentNodeId=null;
const G=__GRAPH_DATA__;const byId=new Map(G.nodes.map(n=>[n.id,n]));const families=G.nodes.filter(n=>n.kind==='family').sort((a,b)=>a.id.localeCompare(b.id));
const $=id=>document.getElementById(id);const label=n=>String(n.properties.title||n.properties.statement||n.properties.input||n.id).replace(/<[^>]*>/g,'').replace(/\$`|`\$/g,'');
const relationLabels={member_of:'属于',derived_from:'来自',depends_on:'依赖',uses:'使用',tests:'检验',historical_context:'历史背景',cites:'引用',classified_as:'学科',sourced_from_revision:'固定版本',generated_by:'生成记录',compared_with:'比较旧方法／接口',compares_with:'比较旧方法／接口',has_scope_condition:'适用条件',scope_mismatch:'范围不匹配',reviews:'审计对象',supports:'支持（非必需前提）'};
$('stats').innerHTML=`<span><b>${families.length}</b> 成果族登记</span><span><b>${G.nodes.length}</b> 节点</span><span><b>${G.edges.length}</b> 类型关系</span><span><b>0</b> 真人审核</span>`;
for(const s of [...new Set(families.map(n=>n.properties.subject))].sort()){const o=document.createElement('option');o.textContent=s;o.value=s;$('subject').append(o)}
function showDetail(id){currentNodeId=id;const n=byId.get(id);$('detail-title').textContent=id+' · 出处、条件与关系';$('detail').textContent=JSON.stringify(n,null,2);$('links').replaceChildren();for(const e of G.edges.filter(e=>e.source===id||e.target===id)){const other=e.source===id?e.target:e.source,b=document.createElement('button');b.textContent=`${e.source===id?'→':'←'} ${relationLabels[e.relation]||e.relation} · ${other}`;b.onclick=()=>selectNode(other);$('links').append(b)}history.replaceState(null,'','#'+encodeURIComponent(id))}
function selectFamily(id){const f=byId.get(id);$('title').textContent=`${id} · ${label(f)}`;$('coverage').textContent='全族六阶段尚未完成。已提取的局部命题也有未核验依赖；不能从节点数推断完成率。';const papers=G.nodes.filter(n=>n.kind==='manuscript'&&n.properties.family_id===id);const claims=G.nodes.filter(n=>['claim','withdrawal'].includes(n.kind)&&G.edges.some(e=>e.source===n.id&&e.target===id&&e.relation==='member_of'));const declared=new Set(G.nodes.filter(n=>n.kind==='family_analysis'&&n.properties.family_id===id).flatMap(n=>n.properties.method_ids||[]));const parts=G.nodes.filter(n=>['method','construction'].includes(n.kind)&&(declared.has(n.id)||G.edges.some(e=>e.source===n.id&&((e.relation==='member_of'&&e.target===id)||claims.some(c=>c.id===e.target)))));const apps=G.nodes.filter(n=>n.kind==='connection'&&n.properties.family_ids.includes(id));$('network').replaceChildren();for(const [title,nodes]of [['手稿 → 成果族',papers],['命题 / 撤回 → 手稿',claims],['零件 → 命题',parts],['应用 → 零件 / 实验',apps]]){const col=document.createElement('div');col.className='column';const h=document.createElement('h3');h.textContent=`${title} · ${nodes.length}`;col.append(h);if(!nodes.length){const p=document.createElement('p');p.className='muted';p.textContent='尚无已整理记录';col.append(p)}for(const n of nodes){const b=document.createElement('button');b.className='node '+n.kind;b.textContent=n.id+' · '+label(n);b.onclick=()=>showDetail(n.id);col.append(b)}$('network').append(col)}showDetail(id)}
function selectNode(id){const n=byId.get(id);if(!n)return;if(n.kind==='family'){selectFamily(id);return}$('title').textContent=id+' · '+label(n);$('coverage').textContent=`类型：${n.kind}；证据：${n.evidence_status||'目录记录'}；字段齐备与关联连线不等于验证完成。`;$('network').replaceChildren();for(const [title,ids]of [['选中节点',[id]],['本节点指向',G.edges.filter(e=>e.source===id).map(e=>e.target)],['指向本节点',G.edges.filter(e=>e.target===id).map(e=>e.source)]]){const unique=[...new Set(ids)],col=document.createElement('div');col.className='column';const h=document.createElement('h3');h.textContent=title+' · '+unique.length;col.append(h);for(const i of unique.slice(0,80)){const x=byId.get(i),b=document.createElement('button');b.className='node '+x.kind;b.textContent=i+' · '+label(x);b.onclick=()=>selectNode(i);col.append(b)}if(unique.length>80){const p=document.createElement('p');p.className='muted';p.textContent='此列显示前80项；完整关系见下方记录。';col.append(p)}$('network').append(col)}showDetail(id)}
function impactIds(){return [...new Set($('impact-input').value.trim().split(/[\s,，]+/).filter(Boolean))]}
$('impact-add').onclick=()=>{const ids=impactIds();if(currentNodeId&&!ids.includes(currentNodeId))ids.push(currentNodeId);$('impact-input').value=ids.join('\n')};
$('impact-clear').onclick=()=>{$('impact-input').value='';$('impact-summary').textContent='';$('impact-routes').replaceChildren();$('impact-results').replaceChildren()};
$('impact-run').onclick=()=>{
 $('impact-routes').replaceChildren();$('impact-results').replaceChildren();
 try{const ids=impactIds();if(!ids.length)throw new Error('请填写至少一个节点 ID');const hit=impactedGraphNodes(G.nodes,G.edges,ids), affected=new Set(hit);
 $('impact-summary').textContent=`输入 ${ids.length} 项；需复核 ${hit.length} 项（含输入），新增 ${hit.filter(id=>!ids.includes(id)).length} 项。`;
 for(const n of G.nodes.filter(n=>n.properties.alternative_proof_route_ids)){const routes=n.properties.alternative_proof_route_ids,marked=routes.filter(id=>affected.has(id)),p=document.createElement('p');p.textContent=`${n.id}：${marked.length}/${routes.length} 条登记路线受影响；主结论${affected.has(n.id)?'需复核':'未被联动'}。未受影响路线：${routes.filter(id=>!affected.has(id)).join('、')||'无'}。未受影响不代表已验证。`;$('impact-routes').append(p)}
 for(const id of hit.slice(0,100)){const b=document.createElement('button');b.className='node';b.textContent=id+' · '+label(byId.get(id));b.onclick=()=>selectNode(id);$('impact-results').append(b)}
 if(hit.length>100){const p=document.createElement('p');p.textContent='显示前100项，完整列表可使用CLI impact查询。';$('impact-results').append(p)}
 }catch(error){$('impact-summary').textContent=error.message}
};
const searchText=new Map(G.nodes.map(n=>[n.id,(n.id+' '+n.kind+' '+JSON.stringify(n.properties)).toLowerCase()]));
function subjectMatches(n,s){if(!s)return true;if(n.properties.subject===s)return true;const ids=[n.properties.family_id,...(n.properties.family_ids||[])];if(n.properties.manuscript_id){const p=byId.get(n.properties.manuscript_id);if(p)ids.push(p.properties.family_id)}for(const e of G.edges)if(e.source===n.id&&e.relation==='member_of')ids.push(e.target);return ids.some(i=>byId.get(i)?.properties.subject===s)}
function filter(){const q=$('search').value.trim().toLowerCase(),s=$('subject').value;$('families').replaceChildren();const found=(q?G.nodes:families).filter(n=>subjectMatches(n,s)&&(!q||searchText.get(n.id).includes(q))).sort((a,b)=>Number(b.id.toLowerCase()===q)-Number(a.id.toLowerCase()===q)||a.id.localeCompare(b.id));$('search-count').textContent=`${q?'全部节点':'成果族'}匹配 ${found.length} 项${found.length>100?'，显示前100项':''}${s?'；仅列有明确学科关联的记录':''}`;for(const n of found.slice(0,100)){const b=document.createElement('button');b.textContent=n.id+' · '+label(n);b.onclick=()=>selectNode(n.id);$('families').append(b)}}$('search').oninput=filter;$('subject').onchange=filter;filter();let initial='F-128';try{const candidate=decodeURIComponent(location.hash.slice(1));if(byId.has(candidate))initial=candidate}catch{}selectNode(initial);
</script></html>
